<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 초대 · Offcourse</title>
<link rel="stylesheet" href="../style.css">
<!-- 사파리 상단 "열기" 배너. app-argument 로 현재 주소를 넘기면 앱이 코드를 그대로
     읽는다. 스크립트로 넣는 이유는 코드가 쿼리에 있어 정적으로 쓸 수 없기 때문이다. -->
<script>
  (function () {
    var meta = document.createElement('meta');
    meta.name = 'apple-itunes-app';
    meta.content = 'app-id=6805121804, app-argument=' + window.location.href;
    document.head.appendChild(meta);
  })();
</script>
<style>
  .logo {
    display: block; width: 160px; max-width: 55%; height: auto;
    margin: 0 0 20px;
  }
  .notice {
    margin: 28px 0 0; text-align: center;
    color: var(--text-soft); font-size: 0.9rem;
  }
  .steps { counter-reset: step; list-style: none; padding: 0; }
  .steps li { counter-increment: step; padding-left: 34px; position: relative; margin-bottom: 10px; }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 1px;
    width: 24px; height: 24px; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 0.8rem; font-weight: 700;
    display: grid; place-items: center;
  }
  .cta {
    display: block; width: 100%; margin: 28px 0 0; padding: 12px;
    background: var(--accent); color: #fff; border-radius: 10px;
    font-size: 0.95rem; font-weight: 600;
    text-align: center; text-decoration: none;
  }
  .legal { margin-top: 20px; text-align: center; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
<img class="logo" src="../img/logo.png" alt="Offcourse" width="720" height="232">
<h1>팀에 초대되었어요</h1>
<p class="meta">Offcourse에서 함께 여행을 준비해보세요.</p>

<h2>참여 방법</h2>
<ol class="steps">
  <li><strong>앱에서 열기</strong>를 누르면 바로 초대 화면으로 갑니다.</li>
  <li>앱이 없다면 App Store에서 <strong>Offcourse</strong>를 설치하세요.</li>
  <li>설치한 뒤 <strong>초대 링크를 다시 열면</strong> 바로 참여할 수 있어요.</li>
</ol>

<a class="cta" id="openApp" href="#">앱에서 열기</a>
<p class="notice" id="notice" hidden>초대 코드가 없는 링크예요. 초대한 사람에게 링크를 다시 받아주세요.</p>

<p class="legal">
  <a href="../privacy/">개인정보 처리방침</a> · <a href="../terms/">이용약관</a>
</p>
</main>
<script>
  // 초대 링크는 ?code=XXXX 형태다. GitHub Pages는 정적 호스팅이라 /join/XXXX 경로 라우팅을
  // 할 수 없어서 쿼리스트링을 쓴다.
  var code = new URLSearchParams(location.search).get('code');
  var openEl = document.getElementById('openApp');
  if (code) {
    openEl.href = 'offcourse://invite/' + encodeURIComponent(code);
  } else {
    openEl.hidden = true;
    document.getElementById('notice').hidden = false;
  }
</script>
</body>
</html>
