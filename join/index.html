<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 초대 · Offcourse</title>
<link rel="stylesheet" href="../style.css">
<!-- 사파리 상단 "열기" 배너. app-argument 로 현재 주소를 넘기면 앱이 코드를 그대로
     읽는다. 스크립트로 넣는 이유는 코드가 쿼리에 있어 정적으로 쓸 수 없기 때문이다. -->
<script>
  (function () {
    var meta = document.createElement('meta');
    meta.name = 'apple-itunes-app';
    meta.content = 'app-id=6805121804, app-argument=' + window.location.href;
    document.head.appendChild(meta);
  })();
</script>
<style>
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.8rem;
    letter-spacing: 0.12em;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 4px;
    word-break: break-all;
  }
  .steps { counter-reset: step; list-style: none; padding: 0; }
  .steps li { counter-increment: step; padding-left: 34px; position: relative; margin-bottom: 10px; }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 1px;
    width: 24px; height: 24px; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 0.8rem; font-weight: 700;
    display: grid; place-items: center;
  }
  .open-app {
    display: block; text-align: center; text-decoration: none;
  }
  .secondary {
    background: var(--surface); color: var(--accent);
    border: 1px solid var(--accent);
  }
  .copy {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
<main>
<h1>팀에 초대되었어요</h1>
<p class="meta">Offcourse에서 함께 여행을 준비해보세요.</p>

<div class="card">
  <p style="margin:0; color:var(--text-soft); font-size:0.85rem; text-align:center;">초대 코드</p>
  <div class="code" id="code">—</div>
  <a class="copy open-app" id="openApp" href="#">앱에서 열기</a>
  <button class="copy secondary" id="copy" type="button">코드 복사하기</button>
</div>

<h2>참여 방법</h2>
<ol class="steps">
  <li><strong>앱에서 열기</strong>를 누르면 바로 초대 화면으로 갑니다.</li>
  <li>앱이 없다면 App Store에서 <strong>Offcourse</strong>를 설치하세요.</li>
  <li>설치 후 <strong>처음 실행할 때</strong> 복사해 둔 코드를 붙여넣을 수 있어요.</li>
</ol>

<p style="margin-top:28px;">
  <a href="../privacy/">개인정보 처리방침</a> · <a href="../terms/">이용약관</a>
</p>

<footer>Offcourse</footer>
</main>
<script>
  // 초대 링크는 ?code=XXXX 형태다. GitHub Pages는 정적 호스팅이라 /join/XXXX 경로 라우팅을
  // 할 수 없어서 쿼리스트링을 쓴다.
  var code = new URLSearchParams(location.search).get('code');
  var codeEl = document.getElementById('code');
  var copyEl = document.getElementById('copy');
  if (code) {
    codeEl.textContent = code;
  } else {
    codeEl.textContent = '코드 없음';
    copyEl.disabled = true;
    copyEl.style.opacity = '0.4';
  }
  var openEl = document.getElementById('openApp');
  if (code) {
    openEl.href = 'offcourse://invite/' + encodeURIComponent(code);
  } else {
    openEl.style.display = 'none';
  }
  copyEl.addEventListener('click', function () {
    if (!code) return;
    navigator.clipboard.writeText(code).then(function () {
      copyEl.textContent = '복사했어요';
      setTimeout(function () { copyEl.textContent = '코드 복사하기'; }, 1600);
    });
  });
</script>
</body>
</html>
